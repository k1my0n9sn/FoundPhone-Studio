name: Validate and deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Restore full-resolution lock-screen wallpaper
        run: |
          cat \
            family-photo-part-00.txt \
            family-photo-part-01.txt \
            tmp-wallpaper-part-02.txt \
            tmp-wallpaper-part-03.txt \
            tmp-wallpaper-part-04.txt \
            tmp-wallpaper-part-05.txt \
            tmp-wallpaper-part-06a.txt \
            tmp-wallpaper-part-06b.txt \
            tmp-wallpaper-part-07a.txt \
            tmp-wallpaper-part-07b.txt \
            tmp-wallpaper-part-08b.txt \
            tmp-wallpaper-part-08c.txt \
            tmp-wallpaper-part-09a.txt \
            tmp-wallpaper-part-09b.txt \
            tmp-wallpaper-part-10a.txt \
            tmp-wallpaper-part-10b.txt \
            tmp-wallpaper-part-11a.txt \
            tmp-wallpaper-part-11b.txt \
            | tr -d '\\n' | base64 --decode > assets/family-lockscreen.webp
          test "$(wc -c < assets/family-lockscreen.webp | tr -d ' ')" -eq 70608
          file assets/family-lockscreen.webp | tee /tmp/wallpaper-info.txt
          grep -q '627x1115' /tmp/wallpaper-info.txt
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run story:validate
      - run: npm run story:test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
